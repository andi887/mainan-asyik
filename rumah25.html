<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumah25 - Tabel Hasil Pertandingan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .back-btn:hover {
            background-color: #95a5a6;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        
        /* ===== STYLE DROPDOWN MARKET ===== */
        .market-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        .market-selector select {
            width: 300px;
            max-width: 90%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }
        .market-selector select:focus {
            border-color: #3498db;
        }
        .market-selector select option {
            padding: 10px;
            font-size: 14px;
        }
        .market-selector select option[value=""] {
            color: #999;
            font-style: italic;
        }
        .current-market {
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        .current-market span {
            background-color: #3498db;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
        }
        button:hover {
            background-color: #34495e;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        button.save-btn {
            background-color: #27ae60;
            font-weight: bold;
        }
        button.save-btn:hover {
            background-color: #2ecc71;
        }
        #status {
            text-align: center;
            margin: 10px;
            font-size: 14px;
            color: #27ae60;
            min-height: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            min-width: 50px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .team-col {
            text-align: left;
            padding-left: 15px;
            min-width: 100px;
            background-color: #ecf0f1;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .date-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 12px;
            text-align: center;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        .match-cell {
            cursor: pointer;
            user-select: none;
        }
        .match-cell:hover {
            background-color: #e8f4f8;
        }
        .w-cell {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
        }
        .x-cell {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
        }
        .empty-cell {
            background-color: #fff;
        }
        .no-win {
            background-color: #f1c40f !important;
            color: #000;
        }
        .table-container {
            display: none;
        }
        .table-container.active {
            display: block;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Kembali ke Rumah Utama</a>

    <h2>Rumah25 - Tabel Hasil Pertandingan</h2>

    <!-- ===== DROPDOWN MARKET ===== -->
    <div class="market-selector">
        <select id="marketSelect" onchange="changeMarket()">
            <option value="">-- Pilih Market --</option>
            <option value="cambodia">🇰🇭 Cambodia</option>
            <option value="sidney">🇦🇺 Sidney</option>
            <option value="china">🇨🇳 China</option>
            <option value="sgp">🇸🇬 SGP</option>
            <option value="japan">🇯🇵 Japan</option>
            <option value="taiwan">🇹🇼 Taiwan</option>
            <option value="hongkong">🇭🇰 Hongkong</option>
            <option value="admin">🛡️ Control Centre (Admin)</option>
        </select>
    </div>

    <div class="current-market" id="currentMarketLabel" style="display:none;">
        Market Aktif: <span id="marketName">-</span>
    </div>

    <div class="button-container">
        <button id="btnAdd" onclick="addColumn()" disabled>+ Tambah Kolom Pertandingan</button>
        <button id="btnSave" onclick="forceSaveToFirebase()" class="save-btn" disabled>💾 Simpan ke Firebase</button>
        <button id="btnReset" onclick="resetAllData()" style="background-color: #e74c3c;" disabled>🗑️ Reset Semua Data</button>
    </div>
    
    <div id="status"></div>

    <!-- ===== TABEL (awalnya tersembunyi) ===== -->
    <div class="table-container" id="tableContainer">
        <table id="matchTable">
            <thead>
                <tr id="headerRow">
                    <th class="team-col">Nama Tim</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <!-- Firebase SDK (Modular v10 - SAMA SEPERTI ORI) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDocs, 
            deleteDoc,
            updateDoc,
            onSnapshot,
            orderBy,
            query
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ GANTI DENGAN KONFIGURASI FIREBASE ANDA (SAMA SEPERTI ORI)
        const firebaseConfig = {
            apiKey: "AIzaSyCr5B0P0X_eqMNYbZonu40NXRxqCmx4t_o",
            authDomain: "sabar-2e686.firebaseapp.com",
            projectId: "sabar-2e686",
            storageBucket: "sabar-2e686.firebasestorage.app",
            messagingSenderId: "917602556667",
            appId: "1:917602556667:web:cc087826739cf2d2cd2e5e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const totalTeams = 12;
        const yellowTeamCount = 4;
        window.matchCount = 0;
        window.isSyncing = false;
        window.currentMarket = null;
        window.currentCollection = null;
        window.unsubscribeSnapshot = null;

        // ===== FUNGSI GANTI MARKET (SAMA SEPERTI ORI) =====
        window.changeMarket = function() {
            const select = document.getElementById('marketSelect');
            const market = select.value;
            
            if (window.unsubscribeSnapshot) {
                window.unsubscribeSnapshot();
                window.unsubscribeSnapshot = null;
            }
            
            if (!market) {
                window.currentMarket = null;
                window.currentCollection = null;
                document.getElementById('tableContainer').classList.remove('active');
                document.getElementById('currentMarketLabel').style.display = 'none';
                document.getElementById('btnAdd').disabled = true;
                document.getElementById('btnSave').disabled = true;
                document.getElementById('btnReset').disabled = true;
                return;
            }
            
            window.currentMarket = market;
            window.currentCollection = collection(db, `rumah25_${market}`);
            
            const marketNames = {
                cambodia: '🇰🇭 Cambodia',
                sidney: '🇦🇺 Sidney',
                china: '🇨🇳 China',
                sgp: '🇸🇬 SGP',
                japan: '🇯🇵 Japan',
                taiwan: '🇹🇼 Taiwan',
                hongkong: '🇭🇰 Hongkong',
                admin: '🛡️ Control Centre (Admin)'
            };
            
            document.getElementById('marketName').textContent = marketNames[market];
            document.getElementById('currentMarketLabel').style.display = 'block';
            document.getElementById('tableContainer').classList.add('active');
            document.getElementById('btnAdd').disabled = false;
            document.getElementById('btnSave').disabled = false;
            document.getElementById('btnReset').disabled = false;
            
            loadMarketData();
        };

        // ===== LOAD DATA MARKET (SAMA SEPERTI ORI - AUTO-SAVE REALTIME) =====
        function loadMarketData() {
            try {
                showStatus('Memuat data...');
                initTable();
                
                const q = query(window.currentCollection, orderBy("order"));
                window.unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                    const matches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderTableFromData(matches);
                    showStatus('✅ Data tersinkronisasi');
                }, (error) => {
                    console.error(error);
                    showStatus('❌ Gagal memuat: ' + error.message);
                });
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal memuat: ' + error.message);
            }
        }

        function initTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= totalTeams; i++) {
                const row = document.createElement('tr');
                const teamCell = document.createElement('td');
                teamCell.className = 'team-col';
                teamCell.textContent = i;
                row.appendChild(teamCell);
                tbody.appendChild(row);
            }
        }

        // ===== TAMBAH KOLOM (SAMA SEPERTI ORI - AUTO-SAVE) =====
        window.addColumn = async function() {
            if (!window.currentCollection) {
                showStatus('❌ Pilih market terlebih dahulu!');
                return;
            }
            try {
                showStatus('Menyimpan kolom baru...');
                const newOrder = window.matchCount + 1;
                const matchData = {
                    order: newOrder,
                    date: '',
                    results: {}
                };
                for (let i = 1; i <= totalTeams; i++) {
                    matchData.results[i] = '';
                }
                await setDoc(doc(window.currentCollection, `match_${newOrder}`), matchData);
                showStatus('✅ Kolom berhasil ditambahkan!');
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menyimpan: ' + error.message);
            }
        };

        // ===== HANDLE KLIK SEL (SAMA SEPERTI ORI - AUTO-SAVE) =====
        window.handleCellClick = async function(cell) {
            if (window.isSyncing) return;
            if (!window.currentCollection) return;
            
            const colOrder = parseInt(cell.dataset.order);
            const rowNumber = parseInt(cell.dataset.row);
            
            try {
                const matchRef = doc(window.currentCollection, `match_${colOrder}`);
                
                if (cell.classList.contains('w-cell')) {
                    const emptyResults = {};
                    for (let i = 1; i <= totalTeams; i++) emptyResults[i] = '';
                    await updateDoc(matchRef, { results: emptyResults });
                    showStatus('✅ Hasil direset');
                    return;
                }
                
                const newResults = {};
                for (let i = 1; i <= totalTeams; i++) {
                    newResults[i] = (i === rowNumber) ? 'W' : 'X';
                }
                await updateDoc(matchRef, { results: newResults });
                showStatus('✅ Hasil disimpan');
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menyimpan: ' + error.message);
            }
        };

        // ===== HANDLE PERUBAHAN TANGGAL (SAMA SEPERTI ORI - AUTO-SAVE) =====
        window.handleDateChange = async function(input, order) {
            if (!window.currentCollection) return;
            try {
                const matchRef = doc(window.currentCollection, `match_${order}`);
                await updateDoc(matchRef, { date: input.value });
            } catch (error) {
                console.error(error);
            }
        };

        // ===== RESET SEMUA DATA (SAMA SEPERTI ORI) =====
        window.resetAllData = async function() {
            if (!window.currentCollection) return;
            if (!confirm(`Yakin ingin menghapus SEMUA data market "${window.currentMarket}"?`)) return;
            try {
                showStatus('Menghapus semua data...');
                const snapshot = await getDocs(window.currentCollection);
                const deletePromises = snapshot.docs.map(doc => deleteDoc(doc.ref));
                await Promise.all(deletePromises);
                showStatus('✅ Semua data dihapus');
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menghapus: ' + error.message);
            }
        };

        // ===== FUNGSI BARU: FORCE SAVE KE FIREBASE =====
        // Tombol ini memastikan semua data di tabel tersinkronisasi penuh ke Firestore
        window.forceSaveToFirebase = async function() {
            if (!window.currentCollection || !window.currentMarket) {
                showStatus('❌ Tidak ada market yang aktif!');
                return;
            }
            
            try {
                showStatus('💾 Menyimpan paksa ke Firebase...');
                
                const tbody = document.getElementById('tableBody');
                const headerRow = document.getElementById('headerRow');
                const rows = tbody.getElementsByTagName('tr');
                const totalCols = headerRow.children.length - 1;
                
                if (totalCols === 0) {
                    showStatus('⚠️ Tidak ada data untuk disimpan');
                    return;
                }
                
                // Ambil semua data dari tabel dan simpan ulang ke Firestore
                const savePromises = [];
                
                for (let colIndex = 1; colIndex <= totalCols; colIndex++) {
                    const dateInput = headerRow.children[colIndex].querySelector('.date-input');
                    const dateValue = dateInput ? dateInput.value : '';
                    const order = colIndex;
                    
                    const results = {};
                    for (let i = 0; i < rows.length; i++) {
                        const teamNumber = i + 1;
                        const cells = rows[i].getElementsByTagName('td');
                        const cell = cells[colIndex];
                        
                        if (cell.classList.contains('w-cell')) {
                            results[teamNumber] = 'W';
                        } else if (cell.classList.contains('x-cell')) {
                            results[teamNumber] = 'X';
                        } else {
                            results[teamNumber] = '';
                        }
                    }
                    
                    const matchData = {
                        order: order,
                        date: dateValue,
                        results: results
                    };
                    
                    savePromises.push(
                        setDoc(doc(window.currentCollection, `match_${order}`), matchData)
                    );
                }
                
                await Promise.all(savePromises);
                showStatus('✅ Semua data berhasil disimpan paksa ke Firebase!');
                setTimeout(() => showStatus(''), 3000);
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menyimpan: ' + error.message);
            }
        };

        // ===== RENDER TABEL (SAMA SEPERTI ORI) =====
        function renderTableFromData(matches) {
            window.isSyncing = true;
            matches.sort((a, b) => a.order - b.order);
            window.matchCount = matches.length;
            
            const headerRow = document.getElementById('headerRow');
            const tbody = document.getElementById('tableBody');
            
            while (headerRow.children.length > 1) headerRow.removeChild(headerRow.lastChild);
            const rows = tbody.getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                while (rows[i].children.length > 1) rows[i].removeChild(rows[i].lastChild);
            }
            
            matches.forEach(match => {
                const newHeader = document.createElement('th');
                const dateInput = document.createElement('input');
                dateInput.type = 'date';
                dateInput.className = 'date-input';
                dateInput.value = match.date || '';
                dateInput.onchange = function() { window.handleDateChange(this, match.order); };
                newHeader.appendChild(dateInput);
                headerRow.appendChild(newHeader);
                
                for (let i = 0; i < rows.length; i++) {
                    const teamNumber = i + 1;
                    const newCell = document.createElement('td');
                    const result = match.results[teamNumber] || '';
                    
                    newCell.className = 'match-cell';
                    newCell.dataset.row = teamNumber;
                    newCell.dataset.order = match.order;
                    newCell.onclick = function() { window.handleCellClick(this); };
                    
                    if (result === 'W') {
                        newCell.classList.add('w-cell');
                        newCell.textContent = 'W';
                    } else if (result === 'X') {
                        newCell.classList.add('x-cell');
                        newCell.textContent = 'X';
                    } else {
                        newCell.classList.add('empty-cell');
                    }
                    rows[i].appendChild(newCell);
                }
            });
            
            checkTeamStatus();
            window.isSyncing = false;
        }

        // ===== CEK STATUS TIM KUNING (SAMA SEPERTI ORI) =====
        function checkTeamStatus() {
            const tbody = document.getElementById('tableBody');
            const rows = tbody.getElementsByTagName('tr');
            const totalCols = document.getElementById('headerRow').children.length - 1;
            
            if (totalCols === 0) {
                for (let i = 0; i < rows.length; i++) rows[i].cells[0].classList.remove('no-win');
                return;
            }
            
            const teamStats = [];
            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].getElementsByTagName('td');
                let lastWinIndex = -1;
                
                for (let j = cells.length - 1; j >= 1; j--) {
                    if (cells[j].classList.contains('w-cell')) {
                        lastWinIndex = j;
                        break;
                    }
                }
                
                let winlessCount;
                if (lastWinIndex === -1) {
                    winlessCount = totalCols;
                } else {
                    winlessCount = totalCols - (lastWinIndex - 1);
                }
                
                teamStats.push({
                    rowIndex: i,
                    teamNumber: i + 1,
                    winlessCount: winlessCount
                });
            }
            
            teamStats.sort((a, b) => {
                if (b.winlessCount !== a.winlessCount) return b.winlessCount - a.winlessCount;
                return a.teamNumber - b.teamNumber;
            });
            
            const yellowTeams = new Set();
            const count = Math.min(yellowTeamCount, teamStats.length);
            for (let i = 0; i < count; i++) yellowTeams.add(teamStats[i].rowIndex);
            
            for (let i = 0; i < rows.length; i++) {
                const teamCell = rows[i].cells[0];
                if (yellowTeams.has(i)) teamCell.classList.add('no-win');
                else teamCell.classList.remove('no-win');
            }
        }

        function showStatus(msg) {
            document.getElementById('status').textContent = msg;
            setTimeout(() => { document.getElementById('status').textContent = ''; }, 3000);
        }
    </script>

</body>
</html>
