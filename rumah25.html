<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumah25 - Tabel Hasil Pertandingan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .back-btn:hover {
            background-color: #95a5a6;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        
        /* ===== STYLE DROPDOWN MARKET ===== */
        .market-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        .market-selector select {
            width: 300px;
            max-width: 90%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }
        .market-selector select:focus {
            border-color: #3498db;
        }
        .market-selector select option {
            padding: 10px;
            font-size: 14px;
        }
        .market-selector select option[value=""] {
            color: #999;
            font-style: italic;
        }
        .current-market {
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        .current-market span {
            background-color: #3498db;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
        }
        button:hover {
            background-color: #34495e;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        button.save-btn {
            background-color: #27ae60;
            font-weight: bold;
        }
        button.save-btn:hover {
            background-color: #2ecc71;
        }
        #status {
            text-align: center;
            margin: 10px;
            font-size: 14px;
            color: #27ae60;
            min-height: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            min-width: 50px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .team-col {
            text-align: left;
            padding-left: 15px;
            min-width: 100px;
            background-color: #ecf0f1;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .date-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 12px;
            text-align: center;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        .match-cell {
            cursor: pointer;
            user-select: none;
        }
        .match-cell:hover {
            background-color: #e8f4f8;
        }
        .w-cell {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
        }
        .x-cell {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
        }
        .empty-cell {
            background-color: #fff;
        }
        .no-win {
            background-color: #f1c40f !important;
            color: #000;
        }
        .table-container {
            display: none;
        }
        .table-container.active {
            display: block;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Kembali ke Rumah Utama</a>

    <h2>Rumah25 - Tabel Hasil Pertandingan</h2>

    <!-- ===== DROPDOWN MARKET ===== -->
    <div class="market-selector">
        <select id="marketSelect" onchange="changeMarket()">
            <option value="">-- Pilih Market --</option>
            <option value="cambodia">🇰🇭 Cambodia</option>
            <option value="sidney">🇦🇺 Sidney</option>
            <option value="china">🇨🇳 China</option>
            <option value="sgp">🇸🇬 SGP</option>
            <option value="japan">🇯🇵 Japan</option>
            <option value="taiwan">🇹🇼 Taiwan</option>
            <option value="hongkong">🇭🇰 Hongkong</option>
            <option value="admin">🛡️ Control Centre (Admin)</option>
        </select>
    </div>

    <div class="current-market" id="currentMarketLabel" style="display:none;">
        Market Aktif: <span id="marketName">-</span>
    </div>

    <div class="button-container">
        <button id="btnAdd" onclick="addColumn()" disabled>+ Tambah Kolom Pertandingan</button>
        <button id="btnSave" onclick="forceSaveToFirebase()" class="save-btn" disabled>💾 Simpan ke Firebase</button>
        <button id="btnReset" onclick="resetAllData()" style="background-color: #e74c3c;" disabled>🗑️ Reset Semua Data</button>
    </div>
    
    <div id="status"></div>

    <!-- ===== TABEL (awalnya tersembunyi) ===== -->
    <div class="table-container" id="tableContainer">
        <table id="matchTable">
            <thead>
                <tr id="headerRow">
                    <th class="team-col">Nama Tim</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <!-- Load Firebase Config (sesuai config-firebase.js Anda) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config-firebase.js"></script>

    <script>
        const totalTeams = 12;
        const yellowTeamCount = 4;
        window.matchCount = 0;
        window.isSyncing = false;
        window.currentMarket = null;
        window.currentDbRef = null;
        window.localMatches = []; // Data lokal untuk force save

        // ===== FUNGSI GANTI MARKET =====
        window.changeMarket = function() {
            const select = document.getElementById('marketSelect');
            const market = select.value;
            
            // Stop listener sebelumnya
            if (window.currentDbRef) {
                window.currentDbRef.off();
            }
            
            if (!market) {
                window.currentMarket = null;
                window.currentDbRef = null;
                window.localMatches = [];
                document.getElementById('tableContainer').classList.remove('active');
                document.getElementById('currentMarketLabel').style.display = 'none';
                document.getElementById('btnAdd').disabled = true;
                document.getElementById('btnSave').disabled = true;
                document.getElementById('btnReset').disabled = true;
                return;
            }
            
            window.currentMarket = market;
            // Path: rumah25/{market}/matches
            window.currentDbRef = firebase.database().ref(`rumah25/${market}/matches`);
            
            const marketNames = {
                cambodia: '🇰🇭 Cambodia',
                sidney: '🇦🇺 Sidney',
                china: '🇨🇳 China',
                sgp: '🇸🇬 SGP',
                japan: '🇯🇵 Japan',
                taiwan: '🇹🇼 Taiwan',
                hongkong: '🇭🇰 Hongkong',
                admin: '🛡️ Control Centre (Admin)'
            };
            
            document.getElementById('marketName').textContent = marketNames[market];
            document.getElementById('currentMarketLabel').style.display = 'block';
            document.getElementById('tableContainer').classList.add('active');
            document.getElementById('btnAdd').disabled = false;
            document.getElementById('btnSave').disabled = false;
            document.getElementById('btnReset').disabled = false;
            
            loadMarketData();
        };

        // ===== LOAD DATA MARKET (AUTO-SAVE REALTIME) =====
        function loadMarketData() {
            if (!window.currentDbRef) return;
            
            try {
                showStatus('Memuat data...');
                initTable();
                
                // Listen to real-time changes
                window.currentDbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        // Convert object to array dan sort by order
                        const matches = Object.values(data).sort((a, b) => a.order - b.order);
                        window.localMatches = matches;
                        window.matchCount = matches.length;
                        renderTableFromData(matches);
                        showStatus('✅ Data tersinkronisasi');
                    } else {
                        window.localMatches = [];
                        window.matchCount = 0;
                        renderTableFromData([]);
                        showStatus('📭 Data kosong');
                    }
                }, (error) => {
                    console.error(error);
                    showStatus('❌ Gagal memuat: ' + error.message);
                });
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal memuat: ' + error.message);
            }
        }

        function initTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= totalTeams; i++) {
                const row = document.createElement('tr');
                const teamCell = document.createElement('td');
                teamCell.className = 'team-col';
                teamCell.textContent = i;
                row.appendChild(teamCell);
                tbody.appendChild(row);
            }
        }

        // ===== TAMBAH KOLOM (AUTO-SAVE KE FIREBASE) =====
        window.addColumn = function() {
            if (!window.currentDbRef || !window.currentMarket) {
                showStatus('❌ Pilih market terlebih dahulu!');
                return;
            }
            
            try {
                showStatus('Menambah kolom...');
                const newOrder = window.matchCount + 1;
                const matchId = `match_${Date.now()}`; // Unique ID
                
                const matchData = {
                    order: newOrder,
                    date: '',
                    results: {}
                };
                
                // Inisialisasi hasil kosong untuk semua tim
                for (let i = 1; i <= totalTeams; i++) {
                    matchData.results[i] = '';
                }
                
                // Simpan ke Firebase (auto-save)
                window.currentDbRef.child(matchId).set(matchData, (error) => {
                    if (error) {
                        console.error(error);
                        showStatus('❌ Gagal menyimpan: ' + error.message);
                    } else {
                        showStatus('✅ Kolom berhasil ditambahkan!');
                    }
                });
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menambahkan: ' + error.message);
            }
        };

        // ===== HANDLE KLIK SEL (AUTO-SAVE KE FIREBASE) =====
        window.handleCellClick = function(cell) {
            if (window.isSyncing) return;
            if (!window.currentDbRef) return;
            
            const matchId = cell.dataset.matchId;
            const rowNumber = parseInt(cell.dataset.row);
            const tbody = document.getElementById('tableBody');
            const rows = tbody.getElementsByTagName('tr');
            
            try {
                // Jika sel sudah W, reset semua di kolom ini
                if (cell.classList.contains('w-cell')) {
                    const emptyResults = {};
                    for (let i = 1; i <= totalTeams; i++) {
                        emptyResults[i] = '';
                    }
                    
                    window.currentDbRef.child(matchId).child('results').update(emptyResults, (error) => {
                        if (error) {
                            console.error(error);
                            showStatus('❌ Gagal mereset: ' + error.message);
                        } else {
                            showStatus('✅ Hasil direset');
                        }
                    });
                    return;
                }
                
                // Set tim ini W, lainnya X
                const newResults = {};
                for (let i = 1; i <= totalTeams; i++) {
                    newResults[i] = (i === rowNumber) ? 'W' : 'X';
                }
                
                window.currentDbRef.child(matchId).child('results').update(newResults, (error) => {
                    if (error) {
                        console.error(error);
                        showStatus('❌ Gagal menyimpan: ' + error.message);
                    } else {
                        showStatus('✅ Hasil disimpan');
                    }
                });
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal: ' + error.message);
            }
        };

        // ===== HANDLE PERUBAHAN TANGGAL (AUTO-SAVE) =====
        window.handleDateChange = function(input, matchId) {
            if (!window.currentDbRef) return;
            
            window.currentDbRef.child(matchId).child('date').set(input.value, (error) => {
                if (error) {
                    console.error(error);
                }
            });
        };

        // ===== FUNGSI BARU: FORCE SAVE KE FIREBASE =====
        window.forceSaveToFirebase = function() {
            if (!window.currentDbRef || !window.currentMarket) {
                showStatus('❌ Tidak ada market yang aktif!');
                return;
            }
            
            try {
                showStatus('💾 Menyimpan paksa ke Firebase...');
                
                const tbody = document.getElementById('tableBody');
                const headerRow = document.getElementById('headerRow');
                const rows = tbody.getElementsByTagName('tr');
                const totalCols = headerRow.children.length - 1;
                
                if (totalCols === 0) {
                    showStatus('⚠️ Tidak ada data untuk disimpan');
                    return;
                }
                
                // Hapus semua data lama di path ini
                window.currentDbRef.remove((error) => {
                    if (error) {
                        console.error(error);
                        showStatus('❌ Gagal menghapus data lama: ' + error.message);
                        return;
                    }
                    
                    // Simpan ulang semua data dari tabel
                    let savedCount = 0;
                    const totalToSave = totalCols;
                    
                    for (let colIndex = 1; colIndex <= totalCols; colIndex++) {
                        const dateInput = headerRow.children[colIndex].querySelector('.date-input');
                        const dateValue = dateInput ? dateInput.value : '';
                        const matchId = `match_force_${Date.now()}_${colIndex}`;
                        
                        const results = {};
                        for (let i = 0; i < rows.length; i++) {
                            const teamNumber = i + 1;
                            const cells = rows[i].getElementsByTagName('td');
                            const cell = cells[colIndex];
                            
                            if (cell.classList.contains('w-cell')) {
                                results[teamNumber] = 'W';
                            } else if (cell.classList.contains('x-cell')) {
                                results[teamNumber] = 'X';
                            } else {
                                results[teamNumber] = '';
                            }
                        }
                        
                        const matchData = {
                            order: colIndex,
                            date: dateValue,
                            results: results
                        };
                        
                        window.currentDbRef.child(matchId).set(matchData, (error) => {
                            if (error) {
                                console.error(error);
                            } else {
                                savedCount++;
                                if (savedCount === totalToSave) {
                                    showStatus('✅ Semua data berhasil disimpan paksa ke Firebase!');
                                    setTimeout(() => showStatus(''), 3000);
                                }
                            }
                        });
                    }
                });
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menyimpan: ' + error.message);
            }
        };

        // ===== RESET SEMUA DATA =====
        window.resetAllData = function() {
            if (!window.currentDbRef || !window.currentMarket) return;
            if (!confirm(`Yakin ingin menghapus SEMUA data market "${window.currentMarket}"?`)) return;
            
            try {
                showStatus('Menghapus semua data...');
                window.currentDbRef.remove((error) => {
                    if (error) {
                        console.error(error);
                        showStatus('❌ Gagal menghapus: ' + error.message);
                    } else {
                        showStatus('✅ Semua data dihapus');
                        window.localMatches = [];
                        window.matchCount = 0;
                    }
                });
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menghapus: ' + error.message);
            }
        };

        // ===== RENDER TABEL =====
        function renderTableFromData(matches) {
            window.isSyncing = true;
            
            const headerRow = document.getElementById('headerRow');
            const tbody = document.getElementById('tableBody');
            
            // Reset header (sisakan "Nama Tim")
            while (headerRow.children.length > 1) {
                headerRow.removeChild(headerRow.lastChild);
            }
            
            // Reset body (sisakan sel nama tim)
            const rows = tbody.getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                while (rows[i].children.length > 1) {
                    rows[i].removeChild(rows[i].lastChild);
                }
            }
            
            // Render kolom dari data
            matches.forEach(match => {
                const matchId = match.id || `match_${match.order}`;
                
                // Header dengan input tanggal
                const newHeader = document.createElement('th');
                const dateInput = document.createElement('input');
                dateInput.type = 'date';
                dateInput.className = 'date-input';
                dateInput.value = match.date || '';
                dateInput.onchange = function() { window.handleDateChange(this, matchId); };
                newHeader.appendChild(dateInput);
                headerRow.appendChild(newHeader);
                
                // Sel untuk setiap tim
                for (let i = 0; i < rows.length; i++) {
                    const teamNumber = i + 1;
                    const newCell = document.createElement('td');
                    const result = match.results[teamNumber] || '';
                    
                    newCell.className = 'match-cell';
                    newCell.dataset.row = teamNumber;
                    newCell.dataset.matchId = matchId;
                    newCell.onclick = function() { window.handleCellClick(this); };
                    
                    if (result === 'W') {
                        newCell.classList.add('w-cell');
                        newCell.textContent = 'W';
                    } else if (result === 'X') {
                        newCell.classList.add('x-cell');
                        newCell.textContent = 'X';
                    } else {
                        newCell.classList.add('empty-cell');
                    }
                    
                    rows[i].appendChild(newCell);
                }
            });
            
            checkTeamStatus();
            window.isSyncing = false;
        }

        // ===== CEK STATUS TIM KUNING =====
        function checkTeamStatus() {
            const tbody = document.getElementById('tableBody');
            const rows = tbody.getElementsByTagName('tr');
            const headerRow = document.getElementById('headerRow');
            const totalCols = headerRow.children.length - 1;
            
            if (totalCols === 0) {
                for (let i = 0; i < rows.length; i++) {
                    rows[i].cells[0].classList.remove('no-win');
                }
                return;
            }
            
            const teamStats = [];
            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].getElementsByTagName('td');
                let lastWinIndex = -1;
                
                for (let j = cells.length - 1; j >= 1; j--) {
                    if (cells[j].classList.contains('w-cell')) {
                        lastWinIndex = j;
                        break;
                    }
                }
                
                let winlessCount;
                if (lastWinIndex === -1) {
                    winlessCount = totalCols;
                } else {
                    winlessCount = totalCols - (lastWinIndex - 1);
                }
                
                teamStats.push({
                    rowIndex: i,
                    teamNumber: i + 1,
                    winlessCount: winlessCount
                });
            }
            
            teamStats.sort((a, b) => {
                if (b.winlessCount !== a.winlessCount) return b.winlessCount - a.winlessCount;
                return a.teamNumber - b.teamNumber;
            });
            
            const yellowTeams = new Set();
            const count = Math.min(yellowTeamCount, teamStats.length);
            for (let i = 0; i < count; i++) {
                yellowTeams.add(teamStats[i].rowIndex);
            }
            
            for (let i = 0; i < rows.length; i++) {
                const teamCell = rows[i].cells[0];
                if (yellowTeams.has(i)) {
                    teamCell.classList.add('no-win');
                } else {
                    teamCell.classList.remove('no-win');
                }
            }
        }

        function showStatus(msg) {
            document.getElementById('status').textContent = msg;
            setTimeout(() => { 
                document.getElementById('status').textContent = ''; 
            }, 3000);
        }
    </script>

</body>
</html>
