<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumah25 - Tabel Hasil Pertandingan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .back-btn:hover {
            background-color: #95a5a6;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        
        .market-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        .market-selector select {
            width: 300px;
            max-width: 90%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }
        .market-selector select:focus {
            border-color: #3498db;
        }
        .market-selector select option {
            padding: 10px;
            font-size: 14px;
        }
        .market-selector select option[value=""] {
            color: #999;
            font-style: italic;
        }
        .current-market {
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        .current-market span {
            background-color: #3498db;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
        }
        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
        }
        button:hover {
            background-color: #34495e;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        button.save-btn {
            background-color: #27ae60;
            font-weight: bold;
        }
        button.save-btn:hover {
            background-color: #2ecc71;
        }
        #status {
            text-align: center;
            margin: 10px;
            font-size: 14px;
            color: #27ae60;
            min-height: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            min-width: 50px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .team-col {
            text-align: left;
            padding-left: 15px;
            min-width: 100px;
            background-color: #ecf0f1;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        /* === PERBAIKAN: TGL/BLN/THN MANUAL EDIT === */
        .date-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background-color: #34495e;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #4a6a8a;
        }
        .date-part {
            width: 30px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
            color: #2c3e50;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            padding: 3px 2px;
            outline: none;
        }
        .date-part:focus {
            border-color: #3498db;
            background: #eaf6ff;
        }
        .date-part.year-part {
            width: 44px;
        }
        .date-sep {
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            margin: 0 1px;
        }
        .date-group.invalid {
            border-color: #e74c3c;
            background-color: #5a2a2a;
        }
        .match-cell {
            cursor: pointer;
            user-select: none;
        }
        .match-cell:hover {
            background-color: #e8f4f8;
        }
        .w-cell {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
        }
        .x-cell {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
        }
        .empty-cell {
            background-color: #fff;
        }
        .no-win {
            background-color: #f1c40f !important;
            color: #000;
        }
        .table-container {
            display: none;
        }
        .table-container.active {
            display: block;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Kembali ke Rumah Utama</a>
    <h2>Rumah25 - Tabel Hasil Pertandingan</h2>
    <div class="market-selector">
        <select id="marketSelect" onchange="changeMarket()">
            <option value="">-- Pilih Market --</option>
            <option value="cambodia">🇰🇭 Cambodia</option>
            <option value="sidney">🇦🇺 Sidney</option>
            <option value="china">🇨🇳 China</option>
            <option value="sgp">🇸🇬 SGP</option>
            <option value="japan">🇯🇵 Japan</option>
            <option value="taiwan">🇹🇼 Taiwan</option>
            <option value="hongkong">🇭🇰 Hongkong</option>
            <option value="admin">🛡 Control Centre (Admin)</option>
        </select>
    </div>
    <div class="current-market" id="currentMarketLabel" style="display:none;">
        Market Aktif: <span id="marketName">-</span>
    </div>
    <div class="button-container">
        <button id="btnAdd" onclick="addColumn()" disabled>+ Tambah Kolom Pertandingan</button>
        <button id="btnSave" onclick="saveToFirebase()" class="save-btn" disabled>💾 Simpan ke Firebase</button>
        <button id="btnReset" onclick="resetAllData()" style="background-color: #e74c3c;" disabled>🗑 Reset Semua Data</button>
    </div>
    
    <div id="status"></div>
    <div class="table-container" id="tableContainer">
        <table id="matchTable">
            <thead>
                <tr id="headerRow">
                    <th class="team-col">Nama Tim</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config-firebase.js"></script>
    <script>
        const totalTeams = 12;
        const yellowTeamCount = 4;
        window.matchCount = 0;
        window.isSyncing = false;
        window.currentMarket = null;
        window.currentDbRef = null;
        // ===== FUNGSI GANTI MARKET =====
        window.changeMarket = function() {
            const select = document.getElementById('marketSelect');
            const market = select.value;
            
            if (window.currentDbRef) {
                window.currentDbRef.off();
            }
            
            if (!market) {
                window.currentMarket = null;
                window.currentDbRef = null;
                document.getElementById('tableContainer').classList.remove('active');
                document.getElementById('currentMarketLabel').style.display = 'none';
                document.getElementById('btnAdd').disabled = true;
                document.getElementById('btnSave').disabled = true;
                document.getElementById('btnReset').disabled = true;
                return;
            }
            
            window.currentMarket = market;
            window.currentDbRef = firebase.database().ref(`rumah25/${market}/matches`);
            
            const marketNames = {
                cambodia: '🇰🇭 Cambodia',
                sidney: '🇦🇺 Sidney',
                china: '🇨🇳 China',
                sgp: '🇸🇬 SGP',
                japan: '🇯🇵 Japan',
                taiwan: '🇹🇼 Taiwan',
                hongkong: '🇭🇰 Hongkong',
                admin: '🛡 Control Centre (Admin)'
            };
            
            document.getElementById('marketName').textContent = marketNames[market];
            document.getElementById('currentMarketLabel').style.display = 'block';
            document.getElementById('tableContainer').classList.add('active');
            document.getElementById('btnAdd').disabled = false;
            document.getElementById('btnSave').disabled = false;
            document.getElementById('btnReset').disabled = false;
            
            loadMarketData();
        };
        // ===== LOAD DATA MARKET (DESCENDING: Terbaru di Kiri) =====
        function loadMarketData() {
            try {
                showStatus('Memuat data...');
                initTable();
                
                window.currentDbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    let matches = [];
                    
                    if (data) {
                        // ⭐ DESCENDING: order besar (terbaru) di kiri, dekat Nama Tim
                        matches = Object.values(data).sort((a, b) => b.order - a.order);
                    }
                    
                    window.matchCount = matches.length;
                    renderTableFromData(matches);
                    showStatus('✅ Data tersinkronisasi');
                }, (error) => {
                    console.error(error);
                    showStatus('❌ Gagal memuat: ' + error.message);
                });
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal memuat: ' + error.message);
            }
        }
        function initTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= totalTeams; i++) {
                const row = document.createElement('tr');
                const teamCell = document.createElement('td');
                teamCell.className = 'team-col';
                teamCell.textContent = i;
                row.appendChild(teamCell);
                tbody.appendChild(row);
            }
        }
        // ===== FUNGSI BANTU: Dapatkan tanggal hari ini (YYYY-MM-DD) =====
        function getTodayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        function parseDateToParts(dateStr) {
            if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return { d: '', m: '', y: '' };
            const [y,m,d] = dateStr.split('-');
            return { d, m, y };
        }
        function buildDateString(day, month, year) {
            const d = String(day).padStart(2,'0');
            const m = String(month).padStart(2,'0');
            const y = String(year).padStart(4,'0');
            return `${y}-${m}-${d}`;
        }
        function isValidDateParts(d,m,y) {
            if (!d || !m || !y) return false;
            const day = parseInt(d,10), month = parseInt(m,10), year = parseInt(y,10);
            if (isNaN(day) || isNaN(month) || isNaN(year)) return false;
            if (year < 1900 || year > 2100) return false;
            if (month < 1 || month > 12) return false;
            if (day < 1 || day > 31) return false;
            const dt = new Date(year, month-1, day);
            return dt.getFullYear()===year && dt.getMonth()===month-1 && dt.getDate()===day;
        }
        // ===== TAMBAH KOLOM (Tanggal = Hari Ini Saat Dibuat) =====
        window.addColumn = function() {
            if (!window.currentDbRef) {
                showStatus('❌ Pilih market terlebih dahulu!');
                return;
            }
            try {
                showStatus('Menyimpan kolom baru...');
                const newOrder = window.matchCount + 1;
                const matchId = `match_${newOrder}`;
                
                const todayDate = getTodayDate();
                
                const matchData = {
                    order: newOrder,
                    date: todayDate,
                    results: {}
                };
                for (let i = 1; i <= totalTeams; i++) {
                    matchData.results[i] = '';
                }
                
                window.currentDbRef.child(matchId).set(matchData)
                    .then(() => showStatus('✅ Kolom berhasil ditambahkan!'))
                    .catch(error => showStatus('❌ Gagal menyimpan: ' + error.message));
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menyimpan: ' + error.message);
            }
        };
        // ===== HANDLE KLIK SEL =====
        window.handleCellClick = function(cell) {
            if (window.isSyncing) return;
            if (!window.currentDbRef) return;
            
            const matchId = cell.dataset.matchId;
            const rowNumber = parseInt(cell.dataset.row);
            
            try {
                if (cell.classList.contains('w-cell')) {
                    const emptyResults = {};
                    for (let i = 1; i <= totalTeams; i++) emptyResults[i] = '';
                    
                    window.currentDbRef.child(matchId).child('results').update(emptyResults);
                    showStatus('✅ Hasil direset');
                    return;
                }
                
                const newResults = {};
                for (let i = 1; i <= totalTeams; i++) {
                    newResults[i] = (i === rowNumber) ? 'W' : 'X';
                }
                
                window.currentDbRef.child(matchId).child('results').update(newResults);
                showStatus('✅ Hasil disimpan');
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menyimpan: ' + error.message);
            }
        };
        // ===== PERBAIKAN: HANDLE PERUBAHAN TANGGAL MANUAL TGL/BLN/THN =====
        window.handleManualDateChange = function(inputEl, matchId) {
            if (!window.currentDbRef) return;
            try {
                const group = inputEl.closest('.date-group');
                if (!group) return;
                const dInput = group.querySelector('.date-d');
                const mInput = group.querySelector('.date-m');
                const yInput = group.querySelector('.date-y');
                
                let d = dInput.value.trim();
                let m = mInput.value.trim();
                let y = yInput.value.trim();
                // Hanya angka
                dInput.value = d.replace(/[^0-9]/g,'');
                mInput.value = m.replace(/[^0-9]/g,'');
                yInput.value = y.replace(/[^0-9]/g,'');
                d = dInput.value; m = mInput.value; y = yInput.value;
                // Jika belum lengkap, jangan simpan dulu
                if (d.length < 1 || m.length < 1 || y.length < 4) {
                    group.classList.remove('invalid');
                    return;
                }
                if (!isValidDateParts(d,m,y)) {
                    group.classList.add('invalid');
                    showStatus('⚠ Tanggal tidak valid: ' + d + '/' + m + '/' + y);
                    return;
                }
                group.classList.remove('invalid');
                const newDate = buildDateString(d,m,y);
                window.currentDbRef.child(matchId).child('date').set(newDate);
                showStatus('📝 Tanggal diperbarui: ' + d + '/' + m + '/' + y);
            } catch (error) {
                console.error(error);
            }
        };
        // Legacy wrapper agar fungsi lama tetap ada (tidak merusak logic lain)
        window.handleDateChange = function(input, matchId) {
            // Jika dipanggil dari sistem lama, arahkan ke manual handler
            if (input && input.value && /^\d{4}-\d{2}-\d{2}$/.test(input.value)) {
                window.currentDbRef.child(matchId).child('date').set(input.value);
                showStatus('📝 Tanggal diperbarui');
            }
        };
        // ===== 💾 SIMPAN KE FIREBASE =====
        window.saveToFirebase = function() {
            if (!window.currentDbRef || !window.currentMarket) {
                showStatus('❌ Tidak ada market yang aktif!');
                return;
            }
            
            try {
                showStatus('💾 Menyimpan ke Firebase...');
                
                const headerRow = document.getElementById('headerRow');
                const tbody = document.getElementById('tableBody');
                const rows = tbody.getElementsByTagName('tr');
                const totalCols = headerRow.children.length - 1;
                
                if (totalCols === 0) {
                    showStatus('⚠ Tidak ada data untuk disimpan');
                    return;
                }
                
                const allData = {};
                
                for (let colIndex = 1; colIndex <= totalCols; colIndex++) {
                    const th = headerRow.children[colIndex];
                    const dateGroup = th.querySelector('.date-group');
                    let dateValue = '';
                    if (dateGroup) {
                        const d = dateGroup.querySelector('.date-d')?.value || '';
                        const m = dateGroup.querySelector('.date-m')?.value || '';
                        const y = dateGroup.querySelector('.date-y')?.value || '';
                        if (d && m && y && isValidDateParts(d,m,y)) {
                            dateValue = buildDateString(d,m,y);
                        } else {
                            // Fallback coba ambil dari data- attribute
                            dateValue = dateGroup.dataset.fullDate || '';
                        }
                    }
                    
                    const firstCell = rows[0].getElementsByTagName('td')[colIndex];
                    const matchId = firstCell ? firstCell.dataset.matchId : `match_${colIndex}`;
                    
                    const orderMatch = matchId.match(/match_(\d+)/);
                    const order = orderMatch ? parseInt(orderMatch[1]) : colIndex;
                    
                    const results = {};
                    for (let i = 0; i < rows.length; i++) {
                        const teamNumber = i + 1;
                        const cells = rows[i].getElementsByTagName('td');
                        const cell = cells[colIndex];
                        
                        if (cell) {
                            if (cell.classList.contains('w-cell')) {
                                results[teamNumber] = 'W';
                            } else if (cell.classList.contains('x-cell')) {
                                results[teamNumber] = 'X';
                            } else {
                                results[teamNumber] = '';
                            }
                        }
                    }
                    
                    allData[matchId] = {
                        order: order,
                        date: dateValue,
                        results: results
                    };
                }
                
                window.currentDbRef.set(allData)
                    .then(() => {
                        showStatus('✅ Semua data berhasil disimpan ke Firebase!');
                        setTimeout(() => showStatus(''), 3000);
                    })
                    .catch(error => {
                        console.error(error);
                        showStatus('❌ Gagal menyimpan: ' + error.message);
                    });
                    
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menyimpan: ' + error.message);
            }
        };
        // ===== RESET SEMUA DATA =====
        window.resetAllData = function() {
            if (!window.currentDbRef) return;
            if (!confirm(`Yakin ingin menghapus SEMUA data market "${window.currentMarket}"?`)) return;
            try {
                showStatus('Menghapus semua data...');
                window.currentDbRef.remove()
                    .then(() => showStatus('✅ Semua data dihapus'))
                    .catch(error => showStatus('❌ Gagal menghapus: ' + error.message));
            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal menghapus: ' + error.message);
            }
        };
        // ===== RENDER TABEL (PERBAIKAN MANUAL DATE) =====
        function renderTableFromData(matches) {
            window.isSyncing = true;
            
            const headerRow = document.getElementById('headerRow');
            const tbody = document.getElementById('tableBody');
            
            while (headerRow.children.length > 1) headerRow.removeChild(headerRow.lastChild);
            const rows = tbody.getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                while (rows[i].children.length > 1) rows[i].removeChild(rows[i].lastChild);
            }
            
            matches.forEach(match => {
                const matchId = `match_${match.order}`;
                const parts = parseDateToParts(match.date);
                
                const newHeader = document.createElement('th');
                const dateGroup = document.createElement('div');
                dateGroup.className = 'date-group';
                dateGroup.dataset.fullDate = match.date || '';
                dateGroup.dataset.matchId = matchId;
                dateGroup.innerHTML = `
                    <input type="text" inputmode="numeric" maxlength="2" class="date-part date-d" placeholder="TGL" value="${parts.d}" 
                        oninput="window.handleManualDateChange(this, '${matchId}')" 
                        onkeyup="if(this.value.length==2){this.nextElementSibling.nextElementSibling?.focus()}" />
                    <span class="date-sep">/</span>
                    <input type="text" inputmode="numeric" maxlength="2" class="date-part date-m" placeholder="BLN" value="${parts.m}"
                        oninput="window.handleManualDateChange(this, '${matchId}')"
                        onkeyup="if(this.value.length==2){this.nextElementSibling.nextElementSibling?.focus()}" />
                    <span class="date-sep">/</span>
                    <input type="text" inputmode="numeric" maxlength="4" class="date-part year-part date-y" placeholder="THN" value="${parts.y}"
                        oninput="window.handleManualDateChange(this, '${matchId}')" />
                `;
                newHeader.appendChild(dateGroup);
                headerRow.appendChild(newHeader);
                
                for (let i = 0; i < rows.length; i++) {
                    const teamNumber = i + 1;
                    const newCell = document.createElement('td');
                    const result = match.results ? match.results[teamNumber] : '';
                    
                    newCell.className = 'match-cell';
                    newCell.dataset.row = teamNumber;
                    newCell.dataset.matchId = matchId;
                    newCell.onclick = function() { window.handleCellClick(this); };
                    
                    if (result === 'W') {
                        newCell.classList.add('w-cell');
                        newCell.textContent = 'W';
                    } else if (result === 'X') {
                        newCell.classList.add('x-cell');
                        newCell.textContent = 'X';
                    } else {
                        newCell.classList.add('empty-cell');
                    }
                    rows[i].appendChild(newCell);
                }
            });
            
            checkTeamStatus();
            window.isSyncing = false;
        }
        // ===== CEK STATUS TIM KUNING =====
        function checkTeamStatus() {
            const tbody = document.getElementById('tableBody');
            const rows = tbody.getElementsByTagName('tr');
            const totalCols = document.getElementById('headerRow').children.length - 1;
            
            if (totalCols === 0) {
                for (let i = 0; i < rows.length; i++) rows[i].cells[0].classList.remove('no-win');
                return;
            }
            
            const teamStats = [];
            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].getElementsByTagName('td');
                let lastWinIndex = -1;
                
                for (let j = cells.length - 1; j >= 1; j--) {
                    if (cells[j].classList.contains('w-cell')) {
                        lastWinIndex = j;
                        break;
                    }
                }
                
                let winlessCount;
                if (lastWinIndex === -1) {
                    winlessCount = totalCols;
                } else {
                    winlessCount = totalCols - (lastWinIndex - 1);
                }
                
                teamStats.push({
                    rowIndex: i,
                    teamNumber: i + 1,
                    winlessCount: winlessCount
                });
            }
            
            teamStats.sort((a, b) => {
                if (b.winlessCount !== a.winlessCount) return b.winlessCount - a.winlessCount;
                return a.teamNumber - b.teamNumber;
            });
            
            const yellowTeams = new Set();
            const count = Math.min(yellowTeamCount, teamStats.length);
            for (let i = 0; i < count; i++) yellowTeams.add(teamStats[i].rowIndex);
            
            for (let i = 0; i < rows.length; i++) {
                const teamCell = rows[i].cells[0];
                if (yellowTeams.has(i)) teamCell.classList.add('no-win');
                else teamCell.classList.remove('no-win');
            }
        }
        function showStatus(msg) {
            document.getElementById('status').textContent = msg;
            setTimeout(() => { document.getElementById('status').textContent = ''; }, 4000);
        }
    </script>
</body>
</html>
